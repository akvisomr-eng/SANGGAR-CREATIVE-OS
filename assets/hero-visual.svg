<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
<title id="title">SANGGAR Creative OS — creative intelligence visual</title>
<desc id="desc">Futuristic creator surrounded by digital creative panels, mountains and glowing platform layers.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset=".52" stop-color="#173f69"/><stop offset="1" stop-color="#e59b83"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08b7ff"/><stop offset=".5" stop-color="#6d5cff"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".18"/><stop offset="1" stop-color="#7ddcff" stop-opacity=".04"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="900" height="720" rx="36" fill="url(#sky)"/>

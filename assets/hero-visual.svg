 <text x="650" y="382" fill="#c9d5e5" font-family="Arial" font-size="12">Siap membantu karya Anda.</text>
 <rect x="650" y="399" width="125" height="7" rx="4" fill="#ffffff" opacity=".2"/><rect x="650" y="399" width="92" height="7" rx="4" fill="url(#glow)"/>

services:
  - type: web
    name: sanggar-creative-os
    runtime: static
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: python tests/test_site.py
    staticPublishPath: .
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: https://auclznarnfooikmfmfvp.supabase.co; font-src 'self'; connect-src 'self' https://auclznarnfooikmfmfvp.supabase.co wss://auclznarnfooikmfmfvp.supabase.co; media-src 'self' https://auclznarnfooikmfmfvp.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
